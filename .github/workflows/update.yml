name: Update Korea IPTV M3U

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run update script
        run: python3 update.py
      
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add kr_live.m3u update.log
          git diff --staged --quiet || git commit -m "auto-update: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
      
      - name: Purge jsDelivr CDN cache
        if: always()
        run: |
          curl -s "https://purge.jsdelivr.net/gh/122566/kr-iptv@main/kr_live.m3u" > /dev/null 2>&1 || true
